<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SparkleTv · Token Manager Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Exo+2:wght@300;600;800&display=swap" rel="stylesheet"/>
<style>
  /* Aquí van todos los estilos que ya tenías en tu archivo index-2.html */
  :root { --bg: #070b12; --bg2: #0d1320; --bg3: #111c2e; --border: #1a2d4a; --cyan: #00e5ff; --amber: #ffab00; --green: #00e676; --red: #ff1744; --dim: #3a5070; --text: #cde4f5; --mono: 'Share Tech Mono', monospace; --sans: 'Exo 2', sans-serif; }
  /* ... (se respeta todo tu CSS original) ... */
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; margin: 0; padding: 0; }
  header { background: rgba(10, 21, 37, 0.8); border-bottom: 1px solid var(--border); padding: 18px 28px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; backdrop-filter: blur(12px); z-index: 100; }
  .logo-title { font-family: var(--mono); font-size: 20px; letter-spacing: 3px; color: #fff; }
  .logo-title span { color: var(--cyan); }
  .main { max-width: 900px; margin: 0 auto; padding: 25px; }
  .playlist-bar { background: var(--bg2); border: 1px solid var(--border); border-left: 3px solid var(--cyan); padding: 15px; border-radius: 8px; margin-bottom: 25px; display: flex; align-items: center; gap: 12px; }
  .ch-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; transition: 0.3s; overflow: hidden; }
  .ch-head { padding: 15px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
  .btn-del { background: none; border: none; color: var(--red); cursor: pointer; font-size: 18px; padding: 5px 10px; opacity: 0.7; }
  .btn-del:hover { opacity: 1; transform: scale(1.1); }
  /* Estilos para el formulario de agregar */
  .add-form { background: var(--bg2); border: 1px solid var(--cyan); padding: 20px; border-radius: 12px; margin-top: 20px; }
  .form-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); padding: 10px; color: #fff; border-radius: 6px; margin-bottom: 10px; outline: none; }
</style>
</head>
<body>

<header>
  <div class="logo-title">SPARKLETV <span>MANAGER</span></div>
  <div style="display:flex; gap:15px; font-family: var(--mono); font-size: 12px;">
    <div>IP: <input id="ipInput" value="192.168.1.57" style="background:var(--bg3); border:1px solid var(--cyan); color:var(--cyan); width:110px; text-align:center;"></div>
    <div>PORT: <input id="portInput" value="9191" style="background:var(--bg3); border:1px solid var(--cyan); color:var(--cyan); width:50px; text-align:center;"></div>
    <button onclick="applySettings()" style="background:var(--cyan); border:none; border-radius:4px; padding:2px 10px; cursor:pointer; font-weight:bold;">OK</button>
  </div>
</header>

<div class="main">
  <div class="playlist-bar">
    <span style="font-family:var(--mono); color:var(--dim); font-size:10px;">PLAYLIST:</span>
    <code id="playlistUrl" style="color:var(--cyan); font-family:var(--mono); flex:1;">http://192.168.1.57:9191/playlist.m3u8</code>
    <button onclick="copyText('playlistUrl')" style="background:var(--bg3); border:1px solid var(--border); color:var(--dim); cursor:pointer; padding:5px 10px; border-radius:6px;">📋</button>
  </div>

  <div id="chList"></div>

  <div class="add-form">
    <div style="color:var(--cyan); font-family:var(--mono); font-size:12px; margin-bottom:15px;">// AGREGAR CANAL</div>
    <input id="fName" class="form-input" placeholder="Nombre (Ej: ESPN)">
    <input id="fUrl" class="form-input" placeholder="URL m3u8">
    <button onclick="addChannel()" style="background:var(--cyan); color:#000; border:none; width:100%; padding:12px; border-radius:6px; font-weight:bold; cursor:pointer;">AGREGAR A LA GRILLA</button>
  </div>
</div>

<div id="toast" style="position:fixed; bottom:20px; right:20px; background:var(--green); color:#000; padding:10px 20px; border-radius:8px; display:none; font-weight:bold;">✓ ACTUALIZADO</div>

<script>
let channels = JSON.parse(localStorage.getItem('stv_channels')) || [];
let port = localStorage.getItem('stv_port') || 9191;
let localIP = localStorage.getItem('stv_ip') || '192.168.1.57';

function applySettings() {
    localIP = document.getElementById('ipInput').value;
    port = document.getElementById('portInput').value;
    localStorage.setItem('stv_ip', localIP);
    localStorage.setItem('stv_port', port);
    renderAll();
    showToast("Ajustes Guardados");
}

function addChannel() {
    const name = document.getElementById('fName').value;
    const url = document.getElementById('fUrl').value;
    if(!name || !url) return alert("Faltan datos");
    
    channels.push({ id: Date.now(), name, url, logo: '📡' });
    saveAndRender();
    document.getElementById('fName').value = '';
    document.getElementById('fUrl').value = '';
}

// FUNCIÓN PARA ELIMINAR
function delChannel(id) {
    if(!confirm("¿Eliminar este canal?")) return;
    channels = channels.filter(c => c.id !== id);
    saveAndRender();
}

// FUNCIÓN PARA CAMBIAR/EDITAR URL
function saveUrl(id) {
    const newUrl = document.getElementById('url-'+id).value;
    channels = channels.map(c => c.id === id ? {...c, url: newUrl} : c);
    saveAndRender();
    showToast("URL Actualizada");
}

function saveAndRender() {
    localStorage.setItem('stv_channels', JSON.stringify(channels));
    renderAll();
}

function renderAll() {
    const list = document.getElementById('chList');
    document.getElementById('playlistUrl').innerText = `http://${localIP}:${port}/playlist.m3u8`;
    
    list.innerHTML = channels.map(ch => `
        <div class="ch-card">
            <div class="ch-head">
                <div style="display:flex; align-items:center; gap:15px;">
                    <span style="font-size:24px;">${ch.logo}</span>
                    <div>
                        <div style="font-weight:bold; color:#fff;">${ch.name}</div>
                        <div style="font-family:var(--mono); font-size:10px; color:var(--dim);">PROXY: /stream/${ch.id}</div>
                    </div>
                </div>
                <button class="btn-del" onclick="delChannel(${ch.id})">✕</button>
            </div>
            <div style="padding:15px; border-top:1px solid var(--border); background:var(--bg3);">
                <div style="color:var(--cyan); font-family:var(--mono); font-size:9px; margin-bottom:5px;">EDITAR URL:</div>
                <div style="display:flex; gap:10px;">
                    <input id="url-${ch.id}" value="${ch.url}" style="flex:1; background:var(--bg2); border:1px solid var(--border); color:var(--text); padding:8px; border-radius:4px; font-size:11px;">
                    <button onclick="saveUrl(${ch.id})" style="background:var(--green); border:none; padding:5px 15px; border-radius:4px; cursor:pointer; font-weight:bold;">GUARDAR</button>
                </div>
            </div>
        </div>
    `).join('');
}

function showToast(msg) {
    const t = document.getElementById('toast');
    t.innerText = "✓ " + msg;
    t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2000);
}

function copyText(id) {
    const txt = document.getElementById(id).innerText;
    navigator.clipboard.writeText(txt);
    showToast("Copiado");
}

renderAll();
</script>
</body>
</html>
