<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShouukerTV - Lo mejor de la TV Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --azul-oscuro: #0a192f;
            --azul-brillante: #007bff;
            --verde-whatsapp: #25d366;
            --blanco: #ffffff;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--azul-oscuro);
            color: var(--blanco);
            background-image: linear-gradient(rgba(10, 25, 47, 0.8), rgba(10, 25, 47, 0.8)), 
                              url('https://images.unsplash.com/photo-1508098682722-e99c43a406b2?auto=format&fit=crop&w=1350&q=80'); /* Imagen de estadio de fondo */
            background-size: cover;
            background-attachment: fixed;
            background-position: center;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 5%;
            background: rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            font-style: italic;
            color: var(--blanco);
            text-shadow: 0 0 10px var(--azul-brillante);
        }

        .bandera {
            width: 40px;
            border-radius: 3px;
        }

        .container {
            max-width: 1100px;
            margin: 20px auto;
            padding: 20px;
            text-align: center;
        }

        .seccion-canales {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .categoria {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .categoria h3 {
            font-size: 0.9rem;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 2px solid var(--azul-brillante);
            display: inline-block;
        }

        .logos-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }

        .logo-canal {
            width: 50px;
            height: 50px;
            background: #222;
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: bold;
        }

        .pack-futbol {
            border: 2px solid #ffcc00;
        }

        .dispositivos {
            margin: 50px 0;
        }

        .iconos-dispositivos {
            display: flex;
            justify-content: center;
            gap: 30px;
            font-size: 2.5rem;
            margin-top: 15px;
        }

        .btn-whatsapp {
            display: inline-flex;
            align-items: center;
            background-color: var(--verde-whatsapp);
            color: white;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: bold;
            transition: transform 0.3s;
            margin-top: 30px;
        }

        .btn-whatsapp:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(37, 211, 102, 0.4);
        }

        .btn-whatsapp i {
            margin-right: 10px;
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">shouukertv</div>
        <img src="https://flagcdn.com/w80/ar.png" alt="Argentina" class="bandera">
    </header>

    <div class="container">
        <div class="seccion-canales">
            <div class="categoria">
                <h3>TV Abierta</h3>
                <div class="logos-grid">
                    <div class="logo-canal">Telefe</div>
                    <div class="logo-canal">Eltrece</div>
                    <div class="logo-canal">América</div>
                    <div class="logo-canal">Nueve</div>
                </div>
            </div>

            <div class="categoria">
                <h3>HBO</h3>
                <div class="logos-grid">
                    <div class="logo-canal">HBO</div>
                    <div class="logo-canal">HBO 2</div>
                    <div class="logo-canal">Plus</div>
                </div>
            </div>

            <div class="categoria">
                <h3>Universal</h3>
                <div class="logos-grid">
                    <div class="logo-canal">Univ.</div>
                    <div class="logo-canal">Studio</div>
                    <div class="logo-canal">SyFy</div>
                </div>
            </div>

            <div class="categoria pack-futbol">
                <h3>Pack Fútbol</h3>
                <div class="logos-grid">
                    <div class="logo-canal" style="background: #cc0000;">ESPN Prem</div>
                    <div class="logo-canal" style="background: #000;">TNT Sport</div>
                    <div class="logo-canal" style="background: #cc0000;">ESPN</div>
                </div>
            </div>
        </div>

        <div class="dispositivos">
            <p>Disfrutá en todos tus dispositivos</p>
            <div class="iconos-dispositivos">
                <i class="fas fa-tv" title="Smart TV"></i>
                <i class="fas fa-mobile-alt" title="Celular"></i>
                <i class="fas fa-tablet-alt" title="Tablet"></i>
                <i class="fas fa-laptop" title="PC"></i>
            </div>
        </div>

        <a href="https://wa.me/TUNUMERO" class="btn-whatsapp">
            <i class="fab fa-whatsapp"></i> PROBÁ SHOUUKERTV GRATIS
        </a>
    </div>

</body>
</html>
